[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }
packages = [
    "onegov.activity",
    "onegov.agency",
    "onegov.api",
    "onegov.async_http",
    "onegov.chat",
    "onegov.core",
    "onegov.directory",
    "onegov.election_day",
    "onegov.event",
    "onegov.feriennet",
    "onegov.file",
    "onegov.form",
    "onegov.foundation",
    "onegov.foundation6",
    "onegov.fsi",
    "onegov.gever",
    "onegov.gis",
    "onegov.intranet",
    "onegov.landsgemeinde",
    "onegov.newsletter",
    "onegov.onboarding",
    "onegov.org",
    "onegov.page",
    "onegov.parliament",
    "onegov.pas",
    "onegov.pay",
    "onegov.pdf",
    "onegov.people",
    "onegov.plausible",
    "onegov.qrcode",
    "onegov.quill",
    "onegov.recipient",
    "onegov.reservation",
    "onegov.search",
    "onegov.server",
    "onegov.shared",
    "onegov.stepsequence",
    "onegov.swissvotes",
    "onegov.ticket",
    "onegov.town6",
    "onegov.translator_directory",
    "onegov.user",
    "onegov.websockets",
    "onegov.winterthur",
]

[tool.setuptools.dynamic]
version = {attr = "onegov.core.__version__"}

[tool.pytest.ini_options]
log_level = "INFO"
redis_timeout = 60
testpaths = ["tests"]
python_classes = []
python_files = ["test_*.py"]
timeout = 300
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Until pysaml2 is compatible with newer versions of xmlschema
    # we are stuck with this DeprecationWarning
    # See: https://github.com/IdentityPython/pysaml2/issues/947
    '''ignore:pathlib\.PurePath\.as_uri\(\) is deprecated:DeprecationWarning:xmlschema.*:''',
    # fixed upstream
    '''ignore:(tagMap|typeMap) is deprecated:DeprecationWarning:ldap3.*:''',
    # See: https://github.com/sarnold/pdfrw/issues/19
    '''ignore:"[^"]+" is an invalid escape sequence:::''',
]

[tool.coverage.run]
data_file = "/tmp/.coverage"
include = ["*/onegov/*"]
omit = ["*/tests/*"]

[tool.coverage.report]
ignore_errors = true
skip_covered = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "pragma: unreachable",
    "assert_never[(]",
    "@overload",
    "raise NotImplementedError",
    "raise AssertionError[(].unreachable.[)]",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    '''\A(?s:.*# pragma: exclude file.*)\Z'''
]

[tool.mypy]
python_version = "3.14"
follow_imports = "silent"
namespace_packages = true
explicit_package_bases = true
strict = true
implicit_reexport = true
warn_unreachable = true
warn_return_any = false
untyped_calls_exclude = "icalendar"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src:$MYPY_CONFIG_FILE_DIR/stubs"

[[tool.mypy.overrides]]
# ignore missing imports for packages that have no stubs available
module = [
    # FIXME: Remove after https://github.com/gweis/isodate/issues/100
    "isodate.*",
    # FIXME: Remove after https://github.com/lipoja/URLExtract/issues/164
    "urlextract.*",
    # FIXME: Remove after https://github.com/jmcnamara/XlsxWriter/issues/1123
    "xlsxwriter.*"
]
ignore_missing_imports = true


[tool.bandit]
exclude_dirs = [
    "tests",
    "*/**/upgrade.py",
    "*/**/upgrades.py"
]
skips = [
    # ignore asserts
    "B101",
    # ignore meta-codes, we are aware of the implications
    "B403",
    "B404",
    "B405",
]

[tool.flake8]
select = ["TC0" , "TC1"]
per_file_ignores = [
    "*.pyi: TC",
    "tests/**.py: TC",
]
type-checking-py314plus = true
type-checking-sqlalchemy-enabled = true
type-checking-sqlalchemy-mapped-dotted-names = [
    "onegov.core.orm.mixins.dict_property",
    "onegov.core.orm.mixins.content.dict_property",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
src = ["src", "test", "stubs"]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "tests/**/*.py",
    "stubs/**/*.pyi"
]
line-length = 79
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = [
    "ASYNC",
    "B0",
    "C4",
    "D2",
    "D4",
    "E",
    "F",
    "FURB",
    "G2",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PYI",
    "Q",
    "RUF",
    "SIM",
    "SLOT",
    "T",
    "TRY",
    "UP",
    "W",
    "banned-api",
    "blanket-noqa",
    "escape-sequence-in-docstring",
    "invalid-mock-access",
    "logging-warn",
    "loop-iterator-mutation",
    "raise-without-from-inside-except",
    "static-join-to-f-string",
    "stdlib-module-shadowing",
    "trailing-comma-on-bare-tuple",
]
ignore = [
    "ambiguous-variable-name",
    "blank-line-after-function",
    "blank-line-before-class",
    "blank-line-before-function",
    "blank-lines-between-header-and-content",
    # TODO: We would like to enable collapsible-if, but it has a ton of
    #       violations, so it's a big job to clean it up
    "collapsible-if",
    "custom-type-var-for-self",
    "dict-get-with-none-default",
    "error-suffix-on-exception-name",
    "f-string",
    "falsy-dict-get-fallback",
    "hardcoded-string-charset",
    "if-else-block-instead-of-if-exp",
    "if-exp-instead-of-or-operator",
    "if-expr-with-true-false",
    "in-dict-keys",
    "implicit-optional",
    "incorrect-blank-line-after-class",
    "incorrectly-parenthesized-tuple-in-subscript",
    "invalid-get-logger-argument",
    "missing-blank-line-after-summary",
    "meta-class-abc-meta",
    "missing-trailing-period",
    "missing-whitespace-around-arithmetic-operator",
    "module-import-not-at-top-of-file",
    "mutable-class-default",
    "needless-bool",
    "new-line-after-last-paragraph",
    # TODO: Brings lots of violations, needs cleanup in all __init__.py files
    "non-empty-init-module",
    "non-imperative-mood",
    "none-comparison",
    "parenthesize-chained-operators",
    "raise-vanilla-args",
    # NOTE: It probably makes sense to enable this, but the refactor
    #       will take a bit of effort.
    "raise-within-try",
    "read-whole-file",
    "redundant-numeric-union",
    "reimplemented-builtin",
    "reimplemented-starmap",
    # NOTE: We should probably enable this, but we use repeated appends
    #       as a stylistic choice in some cases, extend would add another
    #       level of indentation.
    "repeated-append",
    "slice-copy",
    "subclass-builtin",
    "suppressible-exception",
    "surrounding-whitespace",
    "true-false-comparison",
    "try-consider-else",
    "unnecessary-dict-comprehension-for-iterable",
    "unnecessary-encode-utf8",
    "unnecessary-multiline-docstring",
    "unsorted-dunder-all",
    "unsorted-dunder-slots",
    "unused-loop-control-variable",
    "used-dummy-variable",
    "utf8-encoding-declaration",
    "verbose-decimal-constructor",
    "write-whole-file",
]
unfixable = []
external = ["TC"]
allowed-confusables = ["×"]
preview = true

[tool.ruff.lint.extend-per-file-ignores]
"src/onegov/core/types.py" = ["useless-expression"]
"reportlab_settings.py" = ["N"]
"*.pyi" = [
    "FURB",
    "N",
    "Q",
    # NOTE: We would prefer to set a different target version instead
    #       but there's no per-file-target-version
    "UP",
    "line-too-long",
]
"src/onegov/*/upgrade.py" = [
    "T20",
]
"tests/**/*.py" = [
    "C4",
    "D",
    "FURB",
    "ISC",
    "N",
    "Q",
    "PERF",
    "PIE",
    "PYI",
    "RUF",
    "SIM",
    "T",
    "TRY",
    "UP",
    "blank-line-after-decorator",
    "blank-line-between-methods",
    "blank-lines-before-nested-definition",
    "blank-lines-after-function-or-class",
    "blank-lines-top-level",
    "blanket-noqa",
    "static-join-to-f-string",
    "too-many-blank-lines",
    "unused-variable",
    "useless-expression",
]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = [
    "afterFlowable",
    "HSTORE",
    "sortKey",
    "URL",
    "UUID"
]
classmethod-decorators = [
    # NOTE: We can potentially get rid some of these with SQLAlchemy 2.0
    #       since they should cleanly combine with classmethod
    "declared_attr",
    "expression",
    "comparator",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.flake8-quotes]
avoid-escape = true
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.flake8-bandit]
extend-markup-names = ["chameleon.utils.Markup"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["attr.attrib"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"aiohttp".msg = "We have switched to niquests, please use that instead"
"httpx".msg = "We have switched to niquests, please use that instead"
"requests".msg = "We have switched to niquests, please use that instead"
"weasyprint.HTML".msg = "Use onegov.pdf.fetcher.SafeHTML (blocks file:// and SSRF)"
"weasyprint.CSS".msg = "Use onegov.pdf.fetcher.SafeCSS (blocks file:// and SSRF)"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.deptry]
known_first_party = ["onegov"]

[tool.deptry.per_rule_ignores]
DEP002 = ["bcrypt", "cssmin"]
